name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:
          - os: ubuntu-latest  # the newest Ubuntu image has no Python 3.9 build
            python: "3.9"
          - os: macos-latest  # Python 3.9 jobs on macOS runners keep timing out in the queue; 3.9 is covered on Linux and Windows
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pymupdf pillow
      - name: Self-test
        run: python scripts/guard.py --selftest
      - name: Unit and stress tests
        run: python -m unittest discover tests -v
      - name: Real-life phrasings
        run: |
          python tests/hard_phrasings.py
          python tests/hard_phrasings_2.py

  benchmark:
    # The benchmark builds PDFs with Times New Roman, Arial and Calibri, which ship with Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pymupdf pillow
      - name: 50-case benchmark
        run: |
          python bench/generate.py --n 50 --seed 7
          python bench/evaluate.py
