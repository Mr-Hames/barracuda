name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pymupdf pillow
      - name: Self-test
        run: python scripts/guard.py --selftest
      - name: Unit and stress tests
        run: python -m unittest discover tests -v
      - name: Real-life phrasings
        run: |
          python tests/hard_phrasings.py
          python tests/hard_phrasings_2.py

  benchmark:
    # The benchmark builds PDFs with Times New Roman, Arial and Calibri, which ship with Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pymupdf pillow
      - name: 50-case benchmark
        run: |
          python bench/generate.py --n 50 --seed 7
          python bench/evaluate.py
